<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Telegram Finder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">T</div>
            <div>
                <strong>Telegram Finder</strong>
                <small>v1.5</small>
            </div>
        </div>

        <nav class="nav flex-column gap-1">
            <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
            <a class="nav-link {% if request.endpoint == 'history' %}active{% endif %}" href="{{ url_for('history') }}">Histórico</a>
            <a class="nav-link {% if request.endpoint == 'debug_page' %}active{% endif %}" href="{{ url_for('debug_page') }}">Debug</a>
        </nav>

        <div class="sidebar-tip">
            <strong>Dica honesta:</strong><br>
            Se vier zero, teste com “públicos + meus” para descobrir se a busca está achando algo antes do filtro.
        </div>
    </aside>

    <main class="content">
        {% block content %}{% endblock %}
    </main>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
