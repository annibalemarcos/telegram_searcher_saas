{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm rounded-3 border-0">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold mb-0">Resultados salvos #{{ search_id }}</h4>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary rounded-3" href="{{ url_for('export_results', search_id=search_id, fmt='csv') }}">CSV</a>
        <a class="btn btn-outline-secondary rounded-3" href="{{ url_for('export_results', search_id=search_id, fmt='json') }}">JSON</a>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Título</th><th>Username</th><th>Membros</th><th>Tipo</th><th></th></tr></thead>
        <tbody>
          {% for r in rows %}
          <tr>
            <td>{{ r.title }}</td>
            <td>@{{ r.username }}</td>
            <td>{{ r.participants_count }}</td>
            <td>{{ r.type }}</td>
            <td><a class="btn btn-sm btn-outline-primary rounded-3" target="_blank" href="{{ r.link }}">abrir</a></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
